<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="flex  justify-center text-center items-center bg-gray-300 min-h-screen">
    <div class="bg-gray-400 rounded-lg p-9 shadow-2xl">
        <h1 class="items-center font-bold mb-4">Login</h1>
        <form>
            <div class="flex justify-start mb-2">
                <label class="text-gray-900 w-26 font-bold px-5 py-2" for="">Email</label>
                <input class="focus:outline-violet-300 text-gray-900 focus:ring-2 focus:ring-gray-600  focus:border-gray-900 rounded-lg w-full p-1 px-5 py-2 text-balance" type="email" name="" placeholder="Enter the email">
            </div>
            <div class="flex justify-start mb-4">
                <label class="text-gray-900 font-bold w-30 px-5 py-2" for="">Password</label>
                <input class="text-gray-900 focus:ring-2 focus:outline-violet-300 focus:ring-gray-600  p-1  w-full rounded-lg px-5 py-2 focus text-balance" type="password" name=" " placeholder="Password">
            </div>
            <button class="bg-gray-600 w-full p-1 text-blue-200 rounded-lg hover:bg-cyan-900 shadow-blue-600" type="button">Submit</button>
 
        </form>

    </div>
</body>
</html>
